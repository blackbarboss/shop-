<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вашитон - Интернет-магазин</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- шапка -->
    <header id="home">

        <h1>Вашитон</h1>

        <nav>
            <a href="#home">Главная</a>
            <a href="#catalog">Каталог</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
        </nav>

    </header>


    <!-- основа сайта -->
    <main>

        <!-- каталог -->
        <section id="catalog">

            <h2>Наши товары</h2>

            <div class="products">

                <!-- 1 товар -->
                <div class="product">

                    <img src="https://ir.ozone.ru/s3/multimedia-1-l/wc1000/11328229605.jpg" alt="Протеин">

                    <h3>Протеин для качков</h3>

                    <p>Цена: 450 РУБЛ</p>

                    <button>Купить</button>

                </div>


                <!-- 2 товар -->
                <div class="product">

                    <img src="https://ir.ozone.ru/s3/multimedia-1-j/wc1000/7366349323.jpg" alt="Футболка Levis">

                    <h3>Футболка Levis</h3>

                    <p>Цена: 5500 РУБЛ</p>

                    <button>Купить</button>

                </div>


                <!-- 3 товар -->
                <div class="product">

                    <img src="https://ir.ozone.ru/s3/multimedia-1-0/wc1000/20732250312.jpg" alt="MacBook 13 Neo">

                    <h3>MacBook 13 Neo</h3>

                    <p>Цена: 80000 РУБЛ</p>

                    <button>Купить</button>

                </div>

            </div>

        </section>


        <!-- инфо о магазине -->
        <section id="about">

            <h2>О нас</h2>

            <p>Вашитон — интернет-магазин, в котором можно найти товары по хорошим ценам.</p>

        </section>


        <!-- контакты -->
        <section id="contacts">

            <h2>Контакты</h2>

            <p>Добро пожаловать в наш магазин!</p>

        </section>

    </main>


    <!-- снизу сайта -->
    <footer>

        <p>Вашитон.</p>

    </footer>

</body>

</html>
